services:
  gateway:
    image: nginx:alpine
    container_name: Gateway
    init: true
    volumes:
      - ./Gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    restart: unless-stopped

  isuncoin:
    image: isuncoin:latest
    build:
      context: ./iSunCoin
      dockerfile: Dockerfile
    hostname: isuncoin
    container_name: iSunCoin
    entrypoint: ${ISUNCOIN_CMD}
    init: true
    volumes:
      - isuncoin:/root/.ethereum
    ports:
      - "30303:30303"
    restart: unless-stopped

  tidebit:
    build:
      context: ./TideBit
      dockerfile: Dockerfile
      args:
        BRANCH: ${TIDEBIT_BRANCH:-main}
    container_name: TideBit
    hostname: tidebit
    image: tidebit:latest
    init: true
    restart: unless-stopped
    networks:
      default: null

  storage:
    image: swarmstorage:latest
    build:
      context: ./Storage
      dockerfile: Dockerfile
    hostname: storage
    container_name: Storage
    init: true
    volumes:
      - swarmstorage:/root/.ipfs
    environment:
      - IPFS_PATH=/root/.ipfs
    restart: unless-stopped

  ollama:
    build:
      context: ./Ollama
      dockerfile: Dockerfile
    image: ollama:latest
    container_name: Ollama
    hostname: ollama
    volumes:
      - ollama:/root/.ollama
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma3:4b}
    networks:
      default: null
    restart: unless-stopped

volumes:
  ollama:
  isuncoin:
  swarmstorage:
